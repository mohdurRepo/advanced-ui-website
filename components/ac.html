<section class="market-status" data-breadcrumb-anchor>…</section>

<nav
  class="breadcrumb-bar"
  aria-label="${fn:contains(pageContext.request.locale.language, 'ar') ? 'مسار التنقل' : 'Breadcrumb'}"
  data-breadcrumb
  hidden
>
  <%-- your existing breadcrumb markup, unchanged --%>
</nav>

<noscript>
  <style>
    [data-breadcrumb][hidden] {
      display: block !important;
    }
  </style>
</noscript>

<a rel="dynamic-content" href="lm:template"></a>

<script>
  (function () {
    var crumb = document.querySelector("[data-breadcrumb]");
    if (!crumb) return;

    /* Leave the page untouched while editing in Portal. */
    var editing = document.body.classList.contains("edit-mode");
    var anchor = editing
      ? null
      : document.querySelector("[data-breadcrumb-anchor]");

    if (anchor) {
      /* Insert after the whole portlet (its Portal wrapper), not inside it. */
      var portlet = anchor.closest(".component-control") || anchor;
      portlet.insertAdjacentElement("afterend", crumb);
    }

    crumb.hidden = false;
  })();
</script>
