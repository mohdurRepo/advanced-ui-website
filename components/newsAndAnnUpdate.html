<!-- ===============================================================
     Featured Video
================================================================ -->

<article
  class="home-spotlight__video home-video-card"
  aria-labelledby="home-featured-video-title"
  data-home-video-card
>
  <h3 id="home-featured-video-title" class="visually-hidden">
    <fmt:message key="home.featured.video.title" />
  </h3>

  <div
    class="home-video-card__wrapper"
    data-home-video
    data-video-url="${fn:escapeXml(videoLink)}"
  >
    <img
      class="home-video-card__thumbnail"
      src="data:image/jpeg;base64,${fn:escapeXml(thumbnailBase64)}"
      alt=""
      loading="lazy"
      decoding="async"
      data-home-video-thumbnail
    />

    <video
      id="home-featured-video-media"
      class="home-video-card__video"
      controls
      playsinline
      preload="metadata"
      hidden
      data-home-video-media
    >
      <source src="${fn:escapeXml(videoLink)}" type="video/mp4" />

      Your browser does not support the video element.
    </video>

    <button
      class="home-video-card__play has-icon icon-play"
      type="button"
      aria-label="Play featured market video"
      aria-controls="home-featured-video-media"
      data-home-video-play
    ></button>
  </div>
</article>

<!-- ===============================================================
     Upcoming Market Activities
================================================================ -->

<section
  class="home-spotlight__activities home-upcoming-activities"
  aria-labelledby="home-upcoming-activities-title"
>
  <h3 id="home-upcoming-activities-title" class="visually-hidden">
    Upcoming market activities
  </h3>

  <div
    class="home-upcoming-activities__swiper swiper"
    data-home-activities-slider
    role="region"
    aria-roledescription="carousel"
    aria-labelledby="home-upcoming-activities-title"
  >
    <div
      id="home-upcoming-activities-slides"
      class="home-upcoming-activities__wrapper swiper-wrapper"
    >
      <!-- =========================================================
           IPO
      ========================================================== -->

      <c:if test="${not empty iops}">
        <div
          class="home-upcoming-activities__slide swiper-slide"
          role="group"
          aria-roledescription="slide"
          aria-label="IPO"
        >
          <section
            class="home-upcoming-activities__body home-upcoming-activities__body--ipo"
            aria-labelledby="home-activities-ipo-title"
          >
            <header class="home-upcoming-activities__header">
              <h4
                id="home-activities-ipo-title"
                class="home-upcoming-activities__title"
              >
                <fmt:message key="ipo.upcoming-ipos" />
              </h4>
            </header>

            <ul class="home-upcoming-activities__list">
              <c:forEach
                var="ipo"
                items="${iops}"
                varStatus="status"
                begin="0"
                end="2"
              >
                <li class="home-upcoming-activities__item">
                  <div class="home-upcoming-activities__counter">
                    <strong
                      class="home-upcoming-activities__days"
                      data-countdown-days
                    >
                      <fmt:formatNumber value="${ipo.daysLeft}" pattern="00" />
                    </strong>

                    <span class="home-upcoming-activities__label">
                      <c:choose>
                        <c:when test="${ipo.daysLeft eq 1}">
                          <fmt:message key="ipo.dayLeft.label" />
                        </c:when>

                        <c:otherwise>
                          <fmt:message key="ipo.daysLeft.label" />
                        </c:otherwise>
                      </c:choose>
                    </span>
                  </div>

                  <div class="home-upcoming-activities__content">
                    <div class="home-upcoming-activities__meta">
                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--hijri"
                        dir="ltr"
                      >
                        ${ipo.hijriDate}
                      </span>

                      <span
                        class="home-upcoming-activities__separator"
                        aria-hidden="true"
                      >
                        |
                      </span>

                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--gregorian"
                        dir="ltr"
                      >
                        ${ipo.gregorianDate}
                      </span>
                    </div>

                    <div class="home-upcoming-activities__company">
                      <p class="home-upcoming-activities__name">
                        <c:choose>
                          <c:when
                            test="${pageContext.request.locale.language eq 'ar'}"
                          >
                            ${ipo.companyNameAr}
                          </c:when>

                          <c:otherwise> ${ipo.companyNameEn} </c:otherwise>
                        </c:choose>
                      </p>
                    </div>
                  </div>
                </li>
              </c:forEach>
            </ul>

            <footer class="home-upcoming-activities__footer">
              <a
                class="btn btn-sm btn-outline-primary btn-arrow home-upcoming-activities__action"
                href="/wps/portal/saudiexchange_v3/market-participants/issuers/ipo?locale=${pageContext.request.locale.language}"
              >
                <span>
                  <fmt:message key="news.label.viewall" />
                </span>

                <span
                  class="has-icon icon-chevron-right icon-flip-rtl"
                  aria-hidden="true"
                ></span>
              </a>
            </footer>
          </section>
        </div>
      </c:if>

      <!-- =========================================================
           Listing
      ========================================================== -->

      <c:if test="${not empty listings}">
        <div
          class="home-upcoming-activities__slide swiper-slide"
          role="group"
          aria-roledescription="slide"
          aria-label="Listing"
        >
          <section
            class="home-upcoming-activities__body home-upcoming-activities__body--listing"
            aria-labelledby="home-activities-listing-title"
          >
            <header class="home-upcoming-activities__header">
              <h4
                id="home-activities-listing-title"
                class="home-upcoming-activities__title"
              >
                <fmt:message key="ipo.listing" />
              </h4>
            </header>

            <ul class="home-upcoming-activities__list">
              <c:forEach
                var="listing"
                items="${listings}"
                varStatus="status"
                begin="0"
                end="2"
              >
                <li class="home-upcoming-activities__item">
                  <div class="home-upcoming-activities__counter">
                    <strong
                      class="home-upcoming-activities__days"
                      data-countdown-days
                    >
                      <fmt:formatNumber
                        value="${listing.daysLeft}"
                        pattern="00"
                      />
                    </strong>

                    <span class="home-upcoming-activities__label">
                      <c:choose>
                        <c:when test="${listing.daysLeft eq 1}">
                          <fmt:message key="ipo.dayLeft.label" />
                        </c:when>

                        <c:otherwise>
                          <fmt:message key="ipo.daysLeft.label" />
                        </c:otherwise>
                      </c:choose>
                    </span>
                  </div>

                  <div class="home-upcoming-activities__content">
                    <div class="home-upcoming-activities__meta">
                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--hijri"
                        dir="ltr"
                      >
                        ${listing.hijriDate}
                      </span>

                      <span
                        class="home-upcoming-activities__separator"
                        aria-hidden="true"
                      >
                        |
                      </span>

                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--gregorian"
                        dir="ltr"
                      >
                        ${listing.gregorianDate}
                      </span>
                    </div>

                    <div class="home-upcoming-activities__company">
                      <p class="home-upcoming-activities__name">
                        <c:choose>
                          <c:when
                            test="${pageContext.request.locale.language eq 'ar'}"
                          >
                            ${listing.companyNameAr}
                          </c:when>

                          <c:otherwise> ${listing.companyNameEn} </c:otherwise>
                        </c:choose>
                      </p>
                    </div>
                  </div>
                </li>
              </c:forEach>
            </ul>

            <footer class="home-upcoming-activities__footer">
              <a
                class="btn btn-sm btn-outline-primary btn-arrow home-upcoming-activities__action"
                href="/wps/portal/saudiexchange_v3/market-participants/issuers/listings?locale=${pageContext.request.locale.language}"
              >
                <span>
                  <fmt:message key="news.label.viewall" />
                </span>

                <span
                  class="has-icon icon-chevron-right icon-flip-rtl"
                  aria-hidden="true"
                ></span>
              </a>
            </footer>
          </section>
        </div>
      </c:if>

      <!-- =========================================================
           CMF
      ========================================================== -->

      <c:if test="${not empty cmf}">
        <div
          class="home-upcoming-activities__slide swiper-slide"
          role="group"
          aria-roledescription="slide"
          aria-label="CMF"
        >
          <section
            class="home-upcoming-activities__body home-upcoming-activities__body--cmf"
            aria-labelledby="home-activities-cmf-title"
          >
            <header class="home-upcoming-activities__header">
              <h4
                id="home-activities-cmf-title"
                class="home-upcoming-activities__title"
              >
                <fmt:message key="ipo.events" />
              </h4>
            </header>

            <ul class="home-upcoming-activities__list">
              <c:forEach
                var="item"
                items="${cmf}"
                varStatus="status"
                begin="0"
                end="2"
              >
                <li class="home-upcoming-activities__item">
                  <div class="home-upcoming-activities__counter">
                    <strong
                      class="home-upcoming-activities__days"
                      data-countdown-days
                    >
                      <fmt:formatNumber value="${item.daysLeft}" pattern="00" />
                    </strong>

                    <span class="home-upcoming-activities__label">
                      <c:choose>
                        <c:when test="${item.daysLeft eq 1}">
                          <fmt:message key="ipo.dayLeft.label" />
                        </c:when>

                        <c:otherwise>
                          <fmt:message key="ipo.daysLeft.label" />
                        </c:otherwise>
                      </c:choose>
                    </span>
                  </div>

                  <div class="home-upcoming-activities__content">
                    <div class="home-upcoming-activities__meta">
                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--hijri"
                        dir="ltr"
                      >
                        ${item.hijriDate}
                      </span>

                      <span
                        class="home-upcoming-activities__separator"
                        aria-hidden="true"
                      >
                        |
                      </span>

                      <span
                        class="home-upcoming-activities__date home-upcoming-activities__date--gregorian"
                        dir="ltr"
                      >
                        ${item.gregorianDate}
                      </span>
                    </div>

                    <div class="home-upcoming-activities__company">
                      <p class="home-upcoming-activities__name">
                        <fmt:message key="ipo.cmf" />
                      </p>
                    </div>
                  </div>
                </li>
              </c:forEach>
            </ul>

            <footer class="home-upcoming-activities__footer">
              <a
                class="btn btn-sm btn-outline-primary btn-arrow home-upcoming-activities__action"
                href="#"
              >
                <span>
                  <fmt:message key="news.label.viewall" />
                </span>

                <span
                  class="has-icon icon-chevron-right icon-flip-rtl"
                  aria-hidden="true"
                ></span>
              </a>
            </footer>
          </section>
        </div>
      </c:if>
    </div>

    <div
      class="home-upcoming-activities__pagination swiper-pagination"
      aria-label="Upcoming activity slides"
    ></div>
  </div>
</section>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const sliders = document.querySelectorAll("[data-home-activities-slider]");

    sliders.forEach(function (sliderElement) {
      const paginationElement = sliderElement.querySelector(
        ".home-upcoming-activities__pagination",
      );

      new Swiper(sliderElement, {
        slidesPerView: 1,
        loop: false,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
        speed: 600,

        autoplay: {
          delay: 3500,
          disableOnInteraction: true,
        },

        pagination: {
          el: paginationElement,
          clickable: true,
        },

        on: {
          reachEnd: function (swiper) {
            window.setTimeout(function () {
              swiper.slideTo(0, 900);
              swiper.autoplay.stop();
            }, 2000);
          },
        },
      });
    });
  });
</script>
