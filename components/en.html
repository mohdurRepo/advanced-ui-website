<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- Exchange Revamp Theme - English -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-itunes-app" content="app-id=443798046" />
    <meta name="google-play-app" content="app-id=com.tadawul.android.app" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: data: content: 'unsafe-inline' 'unsafe-eval'; frame-src https://*.tadawulgroup.sa https://*.euroland.com https://*.tadawul.com.sa https://*.eurolandir.com http://*.euroland.com http://*.eurolandir.com https://*.google.com https://*.youtube-nocookie.com https://*.youtube.com http://jobs.jobvite.com;"
    />

    <!-- Portal-managed head resources and metadata. -->
    <link rel="dynamic-content" href="co:head" />
    <link rel="dynamic-content" href="dyn-cs:id:tadawul_head_v3" />

    <!-- Apply visual preferences before the page is painted. -->
    <script>
      (function () {
        var root = document.documentElement;

        function readPreference(key, fallback) {
          try {
            return localStorage.getItem(key) || fallback;
          } catch (error) {
            return fallback;
          }
        }

        var themeChoice = readPreference("se-theme", "system");

        var accent = readPreference("se-accent", "blue");

        var fontSize = readPreference("se-font-size", "0");

        var contrast = readPreference("se-contrast", "normal");

        var motion = readPreference("se-motion", "normal");

        var prefersDarkTheme =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;

        var resolvedTheme =
          themeChoice === "system"
            ? prefersDarkTheme
              ? "dark"
              : "light"
            : themeChoice;

        root.setAttribute("data-theme", resolvedTheme);

        root.setAttribute("data-theme-choice", themeChoice);

        root.setAttribute("data-accent", accent);

        root.setAttribute("data-font-size", fontSize);

        root.setAttribute("data-contrast", contrast);

        root.setAttribute("data-motion", motion);
      })();
    </script>
  </head>

  <body>
    <!-- Theme toolbar and frame. -->
    <a rel="dynamic-content" href="dyn-cs:id:85theme_toolbar_v3"></a>

    <!-- Header and primary navigation. -->
    <link rel="dynamic-content" href="dyn-cs:id:tadawul_customTopNav_v3" />

    <!-- Shared page-level sections. -->
    <link rel="dynamic-content" href="dyn-cs:id:tadawul_mainSection_v3" />

    <link rel="dynamic-content" href="dyn-cs:id:tadawul_commonPopup_v3" />

    <main class="page page--home">
      <div class="page__background" aria-hidden="true"></div>

      <div id="layoutContainers" role="main">
        <!-- Required Portal layout hooks. Do not remove. -->
        <a
          rel="dynamic-content"
          href="state.portlet:portlet?include=windowState&amp;include=portletMode&amp;mime-type=text/html"
        ></a>

        <a rel="dynamic-content" href="dyn-cs:id:tadawul_layout_v3"></a>
      </div>

      <!-- Global utilities and application surfaces. -->
      <a rel="dynamic-content" href="dyn-cs:id:utility-rail_v3"></a>

      <a rel="dynamic-content" href="dyn-cs:id:authentication_v3"></a>

      <a rel="dynamic-content" href="dyn-cs:id:preferences_v3"></a>

      <a rel="dynamic-content" href="dyn-cs:id:feedback_v3"></a>

      <a rel="dynamic-content" href="dyn-cs:id:global-widgets_v3"></a>
    </main>

    <footer class="footer app-container p-0">
      <a rel="dynamic-content" href="dyn-cs:id:tadawul_footer_v3"></a>
    </footer>

    <!--
      Portal JavaScript configuration bootstrap.
      Keep this near the end of body for client performance.
    -->
    <div
      id="wpthemeComplementaryContent"
      class="wpthemeComplementaryContent"
      role="region"
      aria-labelledby="wpthemeComplementaryContentText"
    >
      <span id="wpthemeComplementaryContentText" class="wpthemeAltText">
        Complementary Content
      </span>

      <a rel="dynamic-content" href="co:config"></a>
    </div>
  </body>
</html>
