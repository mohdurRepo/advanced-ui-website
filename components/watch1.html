<script type="text/javascript">
  (() => {
    "use strict";

    /* ==========================================================================
       Guard
       ========================================================================== */

    if (window.__marketOverviewChartsInitialized) {
      return;
    }

    window.__marketOverviewChartsInitialized = true;

    /* ==========================================================================
       Production Configuration
       ========================================================================== */

    /*
     * Overview market data refreshes once per minute.
     */
    const LIVE_INTERVAL = 60_000;

    /*
     * Keep approximately the latest trading hour visible
     * while the chart is following the live edge.
     */
    const LIVE_WINDOW_DURATION = 60 * 60 * 1_000;

    /*
     * Four hours of one-minute observations.
     *
     * Enough for navigator context while keeping every
     * Highcharts operation small.
     */
    const MAX_POINTS = 240;

    const REQUEST_TIMEOUT = 10_000;

    const TIME_ZONE = "Asia/Riyadh";

    /*
     * Backend dateTime values without an explicit timezone
     * represent Saudi market time.
     *
     * Saudi Arabia is permanently UTC+03:00.
     */
    const RIYADH_OFFSET = "+03:00";

    const INACTIVE_REASON = "overview-inactive";

    const API_READY_TIMEOUT = 10_000;

    /* ==========================================================================
       Markets
       ========================================================================== */

    const MARKETS = Object.freeze([
      Object.freeze({
        key: "tasi",
        apiId: "tasi",

        symbol: "TASI",

        nameEn: "Tadawul All Share Index",
        nameAr: "مؤشر السوق الرئيسية (تاسي)",

        currency: "SAR",
        decimals: 2,

        chartSelector: "#tasi-chart",
        panelSelector: "#market-panel-tasi",
      }),

      Object.freeze({
        key: "nomu",

        /*
         * Page key is `nomu`.
         * Existing backend contract uses `nomuc`.
         */
        apiId: "nomuc",

        symbol: "NOMUC",

        nameEn: "Parallel Market Capped Index",
        nameAr: "مؤشر السوق الموازية (نمو حد أعلى)",

        currency: "SAR",
        decimals: 2,

        chartSelector: "#nomu-chart",
        panelSelector: "#market-panel-nomu",
      }),

      Object.freeze({
        key: "sukuk",
        apiId: "sukuk",

        symbol: "SUKUK",

        nameEn: "Sukuk/Bonds Market Index",
        nameAr: "مؤشر سوق الصكوك / السندات",

        currency: "SAR",
        decimals: 2,

        chartSelector: "#sukuk-chart",
        panelSelector: "#market-panel-sukuk",
      }),

      Object.freeze({
        key: "reits",
        apiId: "reits",

        symbol: "REITS",

        nameEn: "REITs Index",
        nameAr: "صناديق الاستثمار العقارية",

        currency: "SAR",
        decimals: 2,

        chartSelector: "#reits-chart",

        /*
         * REITs chart is inside Funds.
         */
        panelSelector: "#market-panel-funds",
      }),

      Object.freeze({
        key: "mt30",
        apiId: "mt30",

        symbol: "MT30",

        nameEn: "MT30 Index",
        nameAr: "إم تي 30",

        currency: "SAR",
        decimals: 2,

        chartSelector: "#mt30-chart",

        /*
         * MT30 chart is inside Derivatives.
         */
        panelSelector: "#market-panel-derivatives",
      }),
    ]);

    /* ==========================================================================
       Runtime
       ========================================================================== */

    /*
     * One Highcharts controller per market after first visit.
     *
     * Changing tabs suspends the old controller instead
     * of destroying/recreating it.
     */
    const runtimes = new Map();

    /*
     * Initial requests are cancellable.
     *
     * If the user switches tabs before a market's first
     * request finishes, that unused request is aborted.
     */
    const pendingCreations = new Map();

    const panelObservers = [];

    const listenerController = new AbortController();

    let chartAPI = null;

    let activeRuntime = null;

    let activityFrame = null;

    let activityRevision = 0;

    let destroyed = false;

    /* ==========================================================================
       Locale
       ========================================================================== */

    function getLanguage() {
      return document.documentElement.lang || "en";
    }

    function isArabic() {
      return String(getLanguage()).toLowerCase().startsWith("ar");
    }

    function getMarketName(market) {
      return isArabic() ? market.nameAr : market.nameEn;
    }

    function getAxisLabels() {
      return isArabic()
        ? {
            time: "الوقت",
            value: "قيمة المؤشر",
          }
        : {
            time: "Time",
            value: "Index Value",
          };
    }

    function getMessages(market) {
      const name = getMarketName(market);

      return isArabic()
        ? {
            loading: `جارٍ تحميل بيانات ${name}…`,
            empty: `بيانات ${name} غير متاحة حالياً.`,
            error: `تعذر تحميل بيانات ${name}.`,
          }
        : {
            loading: `Loading ${name} data…`,
            empty: `${name} data is currently unavailable.`,
            error: `${name} data could not be loaded.`,
          };
    }

    /* ==========================================================================
       Number Normalization
       ========================================================================== */

    function toFiniteNumber(value) {
      if (
        value === null ||
        value === undefined ||
        (typeof value === "string" && value.trim() === "")
      ) {
        return null;
      }

      const normalized =
        typeof value === "string" ? value.replaceAll(",", "").trim() : value;

      const number = Number(normalized);

      return Number.isFinite(number) ? number : null;
    }

    /* ==========================================================================
       Timestamp Normalization
       ========================================================================== */

    function toTimestamp(value) {
      if (
        value === null ||
        value === undefined ||
        (typeof value === "string" && value.trim() === "")
      ) {
        return null;
      }

      /* ------------------------------------------------------------------------
         Numeric Epoch
         ------------------------------------------------------------------------ */

      if (typeof value === "number" || /^\d+$/.test(String(value).trim())) {
        const numeric = Number(value);

        if (!Number.isFinite(numeric)) {
          return null;
        }

        /*
         * Seconds -> milliseconds.
         */
        return numeric < 10_000_000_000 ? numeric * 1_000 : numeric;
      }

      const source = String(value).trim();

      /* ------------------------------------------------------------------------
         Already Zoned
         ------------------------------------------------------------------------ */

      /*
       * Examples:
       *
       * 2026-09-07T10:00:00Z
       * 2026-09-07T10:00:00+03:00
       * 2026-09-07T10:00:00+0300
       */
      if (/(?:Z|[+-]\d{2}:?\d{2})$/i.test(source)) {
        const timestamp = Date.parse(source);

        return Number.isFinite(timestamp) ? timestamp : null;
      }

      /* ------------------------------------------------------------------------
         Saudi Local ISO DateTime
         ------------------------------------------------------------------------ */

      const isoLocalMatch = source.match(
        /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d{1,3}))?)?$/,
      );

      if (isoLocalMatch) {
        const [
          ,
          year,
          month,
          day,
          hour,
          minute,
          second = "00",
          milliseconds = "",
        ] = isoLocalMatch;

        const fraction = milliseconds ? `.${milliseconds.padEnd(3, "0")}` : "";

        const timestamp = Date.parse(
          `${year}-${month}-${day}T${hour.padStart(
            2,
            "0",
          )}:${minute}:${second}${fraction}${RIYADH_OFFSET}`,
        );

        return Number.isFinite(timestamp) ? timestamp : null;
      }

      /* ------------------------------------------------------------------------
         Saudi Local DD/MM/YYYY
         ------------------------------------------------------------------------ */

      const dayFirstMatch = source.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/,
      );

      if (dayFirstMatch) {
        const [, day, month, year, hour, minute, second = "00"] = dayFirstMatch;

        const timestamp = Date.parse(
          `${year}-${month.padStart(2, "0")}-${day.padStart(
            2,
            "0",
          )}T${hour.padStart(2, "0")}:${minute}:${second}${RIYADH_OFFSET}`,
        );

        return Number.isFinite(timestamp) ? timestamp : null;
      }

      /*
       * Final fallback for any backend representation
       * already understood by the browser.
       */
      const timestamp = Date.parse(source);

      return Number.isFinite(timestamp) ? timestamp : null;
    }

    /* ==========================================================================
       Backend URL
       ========================================================================== */

    function buildMarketApiUrl(market) {
      if (!market) {
        return null;
      }

      const params = new URLSearchParams();

      params.set("methodType", "parsingMethod");

      /* ------------------------------------------------------------------------
         Existing chart type contract
         ------------------------------------------------------------------------ */

      let chartType = "SQL_MI_MSPV";

      if (market.apiId === "nomuc") {
        chartType = "SQL_MI_MSPV_SME";
      } else if (market.apiId === "sukuk") {
        chartType = "SQL_MI_MSPV_SUKUK";
      }

      params.set("chart-type", chartType);

      /* ------------------------------------------------------------------------
         Existing parameter aliases
         ------------------------------------------------------------------------ */

      let chartParameter = market.apiId;

      if (market.apiId === "sukuk") {
        chartParameter = "tsbi";
      } else if (market.apiId === "reits") {
        chartParameter = "trti";
      }

      params.set("chart-parameter", chartParameter);

      params.set("format", "json");

      params.set("pageName", "MarketSummaryHomePageGraph");

      params.set(
        "jwtToken",
        '<%=JwtBean.getJwtToken("marketStatusHomeGraph")%>',
      );

      return `/url?${params.toString()}`;
    }

    /* ==========================================================================
       Snapshot Normalization
       ========================================================================== */

    function normalizeSnapshot(payload) {
      if (!Array.isArray(payload) || !payload.length) {
        return [];
      }

      /*
       * The backend may contain duplicate timestamps.
       *
       * Latest occurrence wins.
       */
      const byTimestamp = new Map();

      for (const item of payload) {
        if (!item || typeof item !== "object") {
          continue;
        }

        const timestamp = toTimestamp(item.dateTime);

        const value = toFiniteNumber(item.indexPrice);

        if (timestamp === null || value === null) {
          continue;
        }

        byTimestamp.set(timestamp, [timestamp, value]);
      }

      /*
       * Highstock expects monotonically ordered X values.
       */
      const points = [...byTimestamp.values()].sort(
        (first, second) => first[0] - second[0],
      );

      /*
       * Overview does not need an unbounded session history.
       */
      return points.length > MAX_POINTS ? points.slice(-MAX_POINTS) : points;
    }

    /* ==========================================================================
       Abort Helpers
       ========================================================================== */

    function createAbortError(message = "The request was cancelled.") {
      const error = new Error(message);

      error.name = "AbortError";

      return error;
    }

    function isAbortError(error) {
      return error?.name === "AbortError";
    }

    /* ==========================================================================
       Backend Request
       ========================================================================== */

    async function requestSnapshot(market, externalSignal = null) {
      const url = buildMarketApiUrl(market);

      if (!url) {
        throw new Error(
          `Unable to build ${market?.symbol || "market"} chart URL.`,
        );
      }

      const controller = new AbortController();

      let timedOut = false;

      const handleExternalAbort = () => {
        controller.abort();
      };

      if (externalSignal) {
        if (externalSignal.aborted) {
          throw externalSignal.reason || createAbortError();
        }

        externalSignal.addEventListener("abort", handleExternalAbort, {
          once: true,
        });
      }

      /*
       * Needed for first-load requests.
       *
       * Live requests are also protected by the live
       * controller's requestTimeout.
       */
      const timeoutId = window.setTimeout(
        () => {
          timedOut = true;

          controller.abort();
        },

        REQUEST_TIMEOUT,
      );

      try {
        const response = await fetch(url, {
          method: "GET",

          credentials: "same-origin",

          signal: controller.signal,

          headers: {
            Accept: "application/json",
          },
        });

        if (!response.ok) {
          throw new Error(
            `${market.symbol} chart request failed with HTTP ${response.status}.`,
          );
        }

        const payload = await response.json();

        return normalizeSnapshot(payload);
      } catch (error) {
        if (timedOut) {
          const timeoutError = new Error(
            `${market.symbol} chart request timed out.`,
          );

          timeoutError.name = "TimeoutError";

          throw timeoutError;
        }

        if (externalSignal?.aborted) {
          throw externalSignal.reason || createAbortError();
        }

        if (controller.signal.aborted) {
          throw createAbortError();
        }

        throw error;
      } finally {
        window.clearTimeout(timeoutId);

        externalSignal?.removeEventListener("abort", handleExternalAbort);
      }
    }

    /* ==========================================================================
       Live Delta
       ========================================================================== */

    function selectLivePoints(snapshot, since) {
      if (!Array.isArray(snapshot) || !snapshot.length) {
        return [];
      }

      const sinceTimestamp = toTimestamp(since);

      /*
       * No existing chart data:
       *
       * return the whole bounded snapshot so the live
       * controller can recover from an initial-load failure.
       */
      if (sinceTimestamp === null) {
        return snapshot;
      }

      /*
       * Include the existing latest timestamp too.
       *
       * This allows Highcharts Point.update() to correct
       * the current market minute if the backend changes it.
       *
       * Any genuinely newer points become the catch-up batch.
       */
      return snapshot.filter((point) => point[0] >= sinceTimestamp);
    }

    /* ==========================================================================
       DOM Resolution
       ========================================================================== */

    function resolveChartElement(market) {
      return document.querySelector(market.chartSelector);
    }

    function resolvePanel(market, chartElement = resolveChartElement(market)) {
      return (
        document.querySelector(market.panelSelector) ||
        chartElement?.closest("[data-market-detail-panel]") ||
        chartElement?.closest("[data-performance-chart]") ||
        chartElement?.closest(".performance-chart") ||
        chartElement?.parentElement ||
        null
      );
    }

    function isElementVisible(element) {
      if (
        !element?.isConnected ||
        element.closest("[hidden]") ||
        element.closest('[aria-hidden="true"]')
      ) {
        return false;
      }

      const rect = element.getBoundingClientRect();

      return Boolean(
        element.getClientRects().length && rect.width > 0 && rect.height > 0,
      );
    }

    function getVisibleMarket() {
      return (
        MARKETS.find((market) =>
          isElementVisible(resolveChartElement(market)),
        ) || null
      );
    }

    /* ==========================================================================
       Comparison Value
       ========================================================================== */

    function resolveComparisonValue(points) {
      if (!Array.isArray(points) || !points.length) {
        return null;
      }

      /*
       * Current endpoint does not expose a separate
       * previous-close value.
       *
       * Until it does, use the first valid chart point
       * as this Overview chart's comparison baseline.
       */
      return toFiniteNumber(points[0]?.[1]);
    }

    /* ==========================================================================
       Market Chart Configuration
       ========================================================================== */

    function createChartOptions(market, panel, initialPoints) {
      const labels = getAxisLabels();

      const comparisonValue = resolveComparisonValue(initialPoints);

      return {
        context: "overview",

        symbol: market.symbol,

        name: getMarketName(market),

        currency: market.currency,

        previousClose: comparisonValue,

        /*
         * Overview is intentionally one
         * simple intraday trend chart.
         */
        mode: "trend",

        range: "1D",

        language: getLanguage(),

        timeZone: TIME_ZONE,

        decimals: market.decimals,

        maxPoints: MAX_POINTS,

        liveWindowDuration: LIVE_WINDOW_DURATION,

        /*
         * Highcharts animation is not useful for a dashboard
         * receiving one-minute market updates.
         */
        animation: false,

        xAxisTitle: labels.time,

        yAxisTitle: labels.value,

        capabilities: {
          intraday: true,

          /*
           * No historical/detail ranges on Overview.
           */
          historical: false,

          live: true,

          navigator: true,

          intradayRange: "1D",
        },

        axis: {
          x: {
            labels: true,

            rotation: 0,

            showFirstLabel: true,

            showLastLabel: true,

            minPadding: 0,

            maxPadding: 0,
          },

          y: {
            /*
             * Overview value axis remains physically
             * on the right in both LTR and RTL.
             */
            opposite: true,

            labels: true,

            minPadding: 0.06,

            maxPadding: 0.06,

            format: {
              decimals: market.decimals,

              useGrouping: true,
            },
          },
        },

        dateFormats: {
          "1D": {
            hour: "2-digit",

            minute: "2-digit",

            hourCycle: "h23",
          },
        },

        tooltipDateFormats: {
          "1D": {
            day: "2-digit",

            month: "short",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hourCycle: "h23",
          },
        },

        /*
         * One application dataset.
         *
         * No candlestick data and no detail ranges.
         */
        ranges: {
          "1D": {
            comparisonValue,

            trend: initialPoints,

            line: initialPoints,
          },
        },

        controls: {
          root: panel,
        },

        /* ----------------------------------------------------------------------
           Highstock Navigator
           ---------------------------------------------------------------------- */

        navigatorEnabled: true,

        navigator: {
          enabled: true,

          labels: true,

          height: 38,

          margin: 10,

          handles: true,

          handleWidth: 7,

          handleHeight: 20,

          tickPixelInterval: 105,

          dataGrouping: false,
        },

        /* ----------------------------------------------------------------------
           Export
           ---------------------------------------------------------------------- */

        /*
         * Disabled for this component only.
         *
         * Highcharts exporting modules remain available
         * globally for other pages/charts.
         */
        exporting: {
          enabled: false,
        },

        /* ----------------------------------------------------------------------
           Live
           ---------------------------------------------------------------------- */

        live: {
          enabled: true,

          interval: LIVE_INTERVAL,

          /*
           * Poll on real minute boundaries.
           */
          alignToInterval: true,

          /*
           * We already requested the initial snapshot
           * before creating Highcharts.
           */
          immediate: false,

          /*
           * Hidden browser tabs do not poll.
           *
           * On return, the controller resumes and asks
           * for everything since its latest timestamp.
           */
          pauseWhenHidden: true,

          retry: true,

          autostart: true,

          requestTimeout: REQUEST_TIMEOUT,

          async fetchPoint({ signal, since } = {}) {
            const snapshot = await requestSnapshot(market, signal);

            const points = selectLivePoints(snapshot, since);

            if (!points.length) {
              return null;
            }

            /*
             * The new controller accepts one point OR a
             * batch through the same live callback.
             *
             * Normal minute:
             *   [same/latest point, new point]
             *   -> one bounded synchronization/redraw.
             *
             * Return after hidden tab:
             *   all points >= since
             *   -> one catch-up setData()/redraw.
             */
            return {
              points,
            };
          },

          onError(error, metadata) {
            if (isAbortError(error)) {
              return;
            }

            console.error(`${market.symbol} live chart update failed.`, {
              error,
              metadata,
            });
          },
        },

        accessibilityDescription: isArabic()
          ? `الأداء اللحظي لمؤشر ${getMarketName(market)}.`
          : `${getMarketName(market)} intraday market performance.`,

        messages: getMessages(market),
      };
    }

    /* ==========================================================================
       Runtime Creation
       ========================================================================== */

    async function createRuntime(market, signal) {
      const existing = runtimes.get(market.key);

      if (existing) {
        return existing;
      }

      const chartElement = resolveChartElement(market);

      if (!chartElement) {
        console.warn(
          `${market.symbol} chart element was not found: ${market.chartSelector}`,
        );

        return null;
      }

      const panel = resolvePanel(market, chartElement);

      if (!panel) {
        console.warn(`${market.symbol} chart panel could not be resolved.`);

        return null;
      }

      panel.setAttribute("aria-busy", "true");

      chartElement.dataset.chartState = "loading";

      let initialPoints = [];

      try {
        /*
         * Fetch before constructing Highcharts.
         *
         * This avoids:
         *
         * empty chart
         * -> snapshot
         * -> immediate structural chart rebuild
         */
        initialPoints = await requestSnapshot(market, signal);
      } catch (error) {
        if (isAbortError(error)) {
          panel.setAttribute("aria-busy", "false");

          return null;
        }

        /*
         * Temporary first-load failure does not permanently
         * kill the chart.
         *
         * The live controller can recover on its next retry.
         */
        console.error(`${market.symbol} initial chart request failed.`, error);
      }

      if (destroyed || signal?.aborted) {
        panel.setAttribute("aria-busy", "false");

        return null;
      }

      try {
        const controller = chartAPI.create(
          chartElement,

          createChartOptions(market, panel, initialPoints),
        );

        if (!controller) {
          throw new Error(`${market.symbol} chart controller was not created.`);
        }

        const runtime = {
          market,
          panel,
          chartElement,
          controller,

          /*
           * Newly-created charts are created only for
           * the currently visible tab.
           */
          active: true,
        };

        runtimes.set(market.key, runtime);

        panel.marketChartController = controller;

        panel.setAttribute("aria-busy", "false");

        return runtime;
      } catch (error) {
        panel.setAttribute("aria-busy", "false");

        console.error(`${market.symbol} chart initialization failed.`, error);

        return null;
      }
    }

    /* ==========================================================================
       Pending Creation
       ========================================================================== */

    function cancelPendingCreation(marketKey) {
      const pending = pendingCreations.get(marketKey);

      if (!pending) {
        return;
      }

      pending.controller.abort();

      pendingCreations.delete(marketKey);
    }

    function cancelOtherPendingCreations(activeMarketKey) {
      for (const marketKey of pendingCreations.keys()) {
        if (marketKey !== activeMarketKey) {
          cancelPendingCreation(marketKey);
        }
      }
    }

    function ensureRuntime(market) {
      const existing = runtimes.get(market.key);

      if (existing) {
        return Promise.resolve(existing);
      }

      const pending = pendingCreations.get(market.key);

      if (pending) {
        return pending.promise;
      }

      const controller = new AbortController();

      const promise = createRuntime(market, controller.signal).finally(() => {
        const current = pendingCreations.get(market.key);

        if (current?.controller === controller) {
          pendingCreations.delete(market.key);
        }
      });

      pendingCreations.set(market.key, {
        controller,
        promise,
      });

      return promise;
    }

    /* ==========================================================================
       Runtime Activity
       ========================================================================== */

    function deactivateRuntime(runtime) {
      if (!runtime || !runtime.active) {
        return;
      }

      runtime.active = false;

      /*
       * Keep Highstock/data in memory.
       *
       * market-chart.js now handles suspension:
       *
       * - live polling pauses
       * - rendering is deferred
       * - resize/theme work is avoided
       */
      runtime.controller.setActive?.(false, INACTIVE_REASON);
    }

    function activateRuntime(runtime) {
      if (!runtime) {
        return;
      }

      if (runtime.active) {
        return;
      }

      runtime.active = true;

      /*
       * market-chart.js resumes the live controller.
       *
       * The next request receives:
       *
       * since = controller's latest stored timestamp
       *
       * so the full backend snapshot is reduced to only
       * the relevant catch-up points.
       */
      runtime.controller.setActive?.(true, INACTIVE_REASON);
    }

    /* ==========================================================================
       Visible Market Synchronization
       ========================================================================== */

    async function synchronizeVisibleMarket(revision) {
      if (destroyed || !chartAPI) {
        return;
      }

      const market = getVisibleMarket();

      /* ------------------------------------------------------------------------
         Nothing Visible
         ------------------------------------------------------------------------ */

      if (!market) {
        if (activeRuntime) {
          deactivateRuntime(activeRuntime);

          activeRuntime = null;
        }

        cancelOtherPendingCreations(null);

        return;
      }

      /*
       * Do not finish creating a chart the user
       * has already navigated away from.
       */
      cancelOtherPendingCreations(market.key);

      /* ------------------------------------------------------------------------
         Same Market
         ------------------------------------------------------------------------ */

      if (activeRuntime?.market.key === market.key) {
        activateRuntime(activeRuntime);

        return;
      }

      /* ------------------------------------------------------------------------
         Suspend Previous
         ------------------------------------------------------------------------ */

      if (activeRuntime) {
        deactivateRuntime(activeRuntime);

        activeRuntime = null;
      }

      /* ------------------------------------------------------------------------
         Create / Reuse Selected Market
         ------------------------------------------------------------------------ */

      const runtime = await ensureRuntime(market);

      if (destroyed || !runtime) {
        return;
      }

      /*
       * Network request may have taken time.
       *
       * Never activate a result for a tab that is
       * no longer selected.
       */
      if (
        revision !== activityRevision ||
        getVisibleMarket()?.key !== market.key
      ) {
        deactivateRuntime(runtime);

        return;
      }

      activeRuntime = runtime;

      activateRuntime(runtime);
    }

    function syncActiveChart() {
      activityFrame = null;

      activityRevision += 1;

      const revision = activityRevision;

      void synchronizeVisibleMarket(revision);
    }

    function scheduleActiveChartSync() {
      if (destroyed || activityFrame !== null) {
        return;
      }

      /*
       * One tab selection may alter multiple classes,
       * hidden attributes and aria-hidden values.
       *
       * Collapse all of them into one resolution.
       */
      activityFrame = window.requestAnimationFrame(syncActiveChart);
    }

    /* ==========================================================================
       Visibility Observation
       ========================================================================== */

    function observeElement(element, observed) {
      if (!element || observed.has(element)) {
        return;
      }

      observed.add(element);

      const observer = new MutationObserver(scheduleActiveChartSync);

      /*
       * Observe only elements responsible for page visibility.
       *
       * Never observe the Highcharts SVG subtree.
       */
      observer.observe(element, {
        attributes: true,

        attributeFilter: ["hidden", "aria-hidden", "class", "style", "open"],
      });

      panelObservers.push(observer);
    }

    function observePanels() {
      if (typeof MutationObserver !== "function") {
        return;
      }

      const observed = new Set();

      for (const market of MARKETS) {
        const chartElement = resolveChartElement(market);

        const panel = resolvePanel(market, chartElement);

        const viewPanel =
          chartElement?.closest("[data-market-view-panel]") || null;

        observeElement(panel, observed);

        observeElement(viewPanel, observed);
      }

      /*
       * Closing the parent Overview disclosure may
       * hide every chart without mutating each market tab.
       */
      observeElement(
        document.querySelector("[data-market-details-disclosure]"),
        observed,
      );
    }

    /* ==========================================================================
       Overview Interaction
       ========================================================================== */

    function bindOverviewActivity() {
      document
        .querySelector("[data-market-overview]")
        ?.addEventListener("click", scheduleActiveChartSync, {
          signal: listenerController.signal,

          passive: true,
        });
    }

    /* ==========================================================================
       Chart API Readiness
       ========================================================================== */

    function waitForChartAPI() {
      return new Promise((resolve, reject) => {
        const started = performance.now();

        function check() {
          if (destroyed) {
            reject(createAbortError());

            return;
          }

          const api = window.SEMarketCharts;

          if (api && typeof api.create === "function") {
            resolve(api);

            return;
          }

          if (performance.now() - started >= API_READY_TIMEOUT) {
            reject(
              new Error(
                "SEMarketCharts did not become available within 10 seconds.",
              ),
            );

            return;
          }

          window.setTimeout(check, 25);
        }

        check();
      });
    }

    function waitForDOM() {
      if (document.readyState !== "loading") {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        document.addEventListener("DOMContentLoaded", resolve, {
          once: true,
        });
      });
    }

    /* ==========================================================================
       Teardown
       ========================================================================== */

    function destroyOverviewCharts() {
      if (destroyed) {
        return;
      }

      destroyed = true;

      activityRevision += 1;

      listenerController.abort();

      for (const observer of panelObservers) {
        observer.disconnect();
      }

      panelObservers.length = 0;

      if (activityFrame !== null) {
        window.cancelAnimationFrame(activityFrame);

        activityFrame = null;
      }

      for (const pending of pendingCreations.values()) {
        pending.controller.abort();
      }

      pendingCreations.clear();

      /*
       * Highcharts instances live until actual page teardown.
       */
      for (const runtime of runtimes.values()) {
        try {
          runtime.controller.destroy?.();
        } catch (error) {
          console.error(
            `${runtime.market.symbol} chart destruction failed.`,
            error,
          );
        }

        if (runtime.panel.marketChartController === runtime.controller) {
          delete runtime.panel.marketChartController;
        }
      }

      runtimes.clear();

      activeRuntime = null;

      chartAPI = null;
    }

    /* ==========================================================================
       Initialization
       ========================================================================== */

    async function initializeOverviewCharts() {
      try {
        await waitForDOM();

        chartAPI = await waitForChartAPI();

        if (destroyed) {
          return;
        }

        observePanels();

        bindOverviewActivity();

        /*
         * Only the currently visible chart is requested
         * and constructed on first paint.
         */
        scheduleActiveChartSync();

        window.addEventListener("pagehide", destroyOverviewCharts, {
          once: true,
        });
      } catch (error) {
        if (isAbortError(error)) {
          return;
        }

        console.error("Market Overview chart initialization failed.", error);
      }
    }

    void initializeOverviewCharts();
  })();
</script>
